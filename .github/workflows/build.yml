name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub release'
        type: boolean
        default: true
      tag:
        description: 'Release tag'
        required: false
        default: 'v1.8.0-windows'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout torlink source
        uses: actions/checkout@v4
        with:
          repository: baairon/torlink
          ref: v1.8.0
          path: torlink

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: torlink
        run: npm install

      - name: Install esbuild and @yao-pkg/pkg
        working-directory: torlink
        run: npm install -g esbuild @yao-pkg/pkg

      - name: Bundle as ESM (handles top-level await)
        working-directory: torlink
        shell: bash
        run: |
          esbuild src/index.tsx \
            --bundle \
            --platform=node \
            --target=node22 \
            --format=esm \
            --outfile=dist/torlink.mjs \
            --jsx=automatic \
            --jsx-import-source=react \
            --loader:.tsx=tsx \
            --loader:.ts=ts \
            --define:process.env.TORLINK_NO_WEBRTC="1" \
            --define:process.env.TORLINK_NO_UPDATE_CHECK="1" \
            --external:node-datachannel \
            --external:utp-native \
            --external:bufferutil \
            --external:utf-8-validate \
            --external:react-devtools-core \
            --external:fs \
            --external:path \
            --external:events \
            --external:crypto \
            --external:os \
            --external:stream \
            --external:net \
            --external:tls \
            --external:child_process \
            --external:url \
            --external:util \
            --external:buffer \
            --external:zlib \
            --external:http \
            --external:https \
            --external:dns \
            --external:readline \
            --external:querystring \
            --external:string_decoder \
            --external:tty \
            --external:assert \
            --external:module

      - name: Create CJS entry wrapper
        working-directory: torlink
        shell: bash
        run: |
          cat > entry.cjs << 'ENTRY'
          #!/usr/bin/env node
          "use strict";
          (async function() {
            try {
              await import("./dist/torlink.mjs");
            } catch(err) {
              console.error(err);
              process.exit(1);
            }
          })();
          ENTRY

      - name: Create webrtc-stub.mjs
        working-directory: torlink
        shell: bash
        run: |
          cat > dist/webrtc-stub.mjs << 'STUB'
          export const RTCPeerConnection = undefined;
          export const RTCSessionDescription = undefined;
          export const RTCIceCandidate = undefined;
          export default undefined;
          STUB

      - name: Configure pkg assets
        working-directory: torlink
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            pkg.bin = { torlnk: 'entry.cjs' };
            pkg.scripts = ['entry.cjs'];
            pkg.assets = ['dist/torlink.mjs', 'dist/webrtc-stub.mjs'];
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Package with @yao-pkg/pkg
        working-directory: torlink
        shell: bash
        run: pkg -t node22-win-x64 -o torlink.exe --fallback-to-source

      - name: Verify exe
        working-directory: torlink
        shell: pwsh
        run: |
          $size = (Get-Item torlink.exe).Length
          $sizeMB = [math]::Round($size / 1MB, 1)
          Write-Host "torlink.exe: $sizeMB MB"
          if ($size -lt 1MB) { throw "exe too small" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: torlink-windows
          path: torlink/torlink.exe

      - name: Create Release
        if: inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: torlink v1.8.0 Windows (ESM + CJS wrapper)
          body: |
            ## torlink v1.8.0 — Windows Native Build

            Built on `windows-latest` with Visual Studio 2022.

            - ESM bundle with CJS wrapper (handles top-level await properly)
            - Native modules compiled on Windows (yoga-layout, node-datachannel, utp-native)
            - Just double-click `torlink.exe` to run

            ### Quick Start
            1. Download `torlink.exe`
            2. Double-click it, or run from terminal: `torlink.exe`
            3. No Node.js needed

            ### What it does
            - Search across curated sources (FitGirl, YTS, The Pirate Bay, 1337x, EZTV, Nyaa, SubsPlease)
            - Download to `Downloads\torlink\` folder
            - Seed automatically after download

            ### Keyboard shortcuts
            - Type query + Enter to search
            - ↑/↓ to navigate, d to download, ? for help

            ### Headless modes
            ```
            torlink.exe search "query" --category movies
            torlink.exe seed ./my-folder
            torlink.exe serve
            torlink.exe watch ./incoming
            ```

            ### Source
            - [baairon/torlink](https://github.com/baairon/torlink) v1.8.0
            - Node.js 22 runtime embedded via @yao-pkg/pkg
          files: torlink/torlink.exe
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
