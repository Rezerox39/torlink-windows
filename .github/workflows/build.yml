name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub release'
        type: boolean
        default: true
      tag:
        description: 'Release tag'
        required: false
        default: 'v1.8.0-windows'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout this repo (has build scripts)
        uses: actions/checkout@v4

      - name: Checkout torlink source
        uses: actions/checkout@v4
        with:
          repository: baairon/torlink
          ref: v1.8.0
          path: torlink

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: torlink
        run: npm install

      - name: Install esbuild and @yao-pkg/pkg
        run: npm install -g esbuild @yao-pkg/pkg

      - name: Create native module stub
        shell: bash
        run: echo 'module.exports = {}; module.exports.default = {};' > scripts/empty.js

      - name: "Pass 1: Bundle to ESM (native modules aliased to stub)"
        working-directory: torlink
        shell: bash
        run: |
          esbuild src/index.tsx \
            --bundle \
            --platform=node \
            --target=node22 \
            --format=esm \
            --outfile=dist/torlink.mjs \
            --jsx=automatic \
            --jsx-import-source=react \
            --loader:.tsx=tsx \
            --loader:.ts=ts \
            --define:process.env.TORLINK_NO_WEBRTC="1" \
            --define:process.env.TORLINK_NO_UPDATE_CHECK="1" \
            --alias:node-datachannel=../scripts/empty.js \
            --alias:utp-native=../scripts/empty.js \
            --alias:bufferutil=../scripts/empty.js \
            --alias:utf-8-validate=../scripts/empty.js \
            --alias:react-devtools-core=../scripts/empty.js \
            --external:fs --external:path --external:os \
            --external:http --external:https --external:net \
            --external:crypto --external:events --external:stream \
            --external:url --external:util --external:child_process \
            --external:dgram --external:dns --external:tls \
            --external:zlib --external:querystring --external:assert \
            --external:buffer --external:timers --external:worker_threads \
            --external:perf_hooks --external:tty --external:readline \
            --external:string_decoder --external:module \
            --external:node:fs --external:node:path --external:node:os \
            --external:node:http --external:node:https --external:node:net \
            --external:node:crypto --external:node:events --external:node:stream \
            --external:node:url --external:node:util --external:node:child_process \
            --external:node:dgram --external:node:dns --external:node:tls \
            --external:node:zlib --external:node:querystring --external:node:assert \
            --external:node:buffer --external:node:timers --external:node:worker_threads \
            --external:node:perf_hooks --external:node:tty --external:node:process \
            --external:node:module --external:fs/promises --external:node:fs/promises

      - name: Hardcode version
        working-directory: torlink
        run: node ../scripts/hardcode-version.mjs dist/torlink.mjs package.json

      - name: "Pass 2: Convert ESM to CJS"
        working-directory: torlink
        run: node ../scripts/esm-to-cjs.mjs dist/torlink.mjs dist/torlink.cjs

      - name: Create webrtc-stub.mjs
        working-directory: torlink
        shell: bash
        run: |
          cat > dist/webrtc-stub.mjs << 'STUB'
          export const RTCPeerConnection = undefined;
          export const RTCSessionDescription = undefined;
          export const RTCIceCandidate = undefined;
          export default undefined;
          STUB

      - name: Configure pkg
        working-directory: torlink
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.scripts=['dist/torlink.cjs'];p.assets=['dist/webrtc-stub.mjs'];fs.writeFileSync('package.json',JSON.stringify(p,null,2))"

      - name: "Pass 3: Package with @yao-pkg/pkg"
        working-directory: torlink
        shell: bash
        run: pkg -t node22-win-x64 dist/torlink.cjs -o torlink.exe --fallback-to-source

      - name: Verify exe
        working-directory: torlink
        shell: pwsh
        run: |
          $size = (Get-Item torlink.exe).Length
          $sizeMB = [math]::Round($size / 1MB, 1)
          Write-Host "torlink.exe: $sizeMB MB"
          if ($size -lt 1MB) { throw "exe too small" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: torlink-windows
          path: torlink/torlink.exe

      - name: Create Release
        if: inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: torlink v1.8.0 Windows (CJS Bundle)
          body: |
            ## torlink v1.8.0 — Windows Native Build

            - Single self-contained CJS file (no .mjs, no dynamic import)
            - Native modules stubbed (degrades to TCP-only transport)
            - No .node files in snapshot — nothing to fail at runtime
            - Just double-click `torlink.exe` to run

            ### Quick Start
            1. Download `torlink.exe`
            2. Double-click it, or run from terminal: `torlink.exe`
            3. No Node.js needed

            ### Source
            - [baairon/torlink](https://github.com/baairon/torlink) v1.8.0
            - Node.js 22 runtime embedded via @yao-pkg/pkg
          files: torlink/torlink.exe
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
