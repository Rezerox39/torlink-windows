name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub release'
        type: boolean
        default: true
      tag:
        description: 'Release tag'
        required: false
        default: 'v1.8.0-windows'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout this repo (has build scripts)
        uses: actions/checkout@v4

      - name: Checkout torlink source
        uses: actions/checkout@v4
        with:
          repository: baairon/torlink
          ref: v1.8.0
          path: torlink

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install torlink dependencies
        working-directory: torlink
        run: npm install

      - name: Install build tools
        run: npm install -g esbuild @yao-pkg/pkg

      - name: "Pass 1: Bundle to ESM (handles top-level await)"
        working-directory: torlink
        run: |
          esbuild src/index.tsx --bundle --platform=node --target=node22 --format=esm --outfile=dist/torlink.mjs --jsx=automatic --jsx-import-source=react --loader:.tsx=tsx --loader:.ts=ts --define:process.env.TORLINK_NO_WEBRTC="1" --define:process.env.TORLINK_NO_UPDATE_CHECK="1" --external:node-datachannel --external:utp-native --external:bufferutil --external:utf-8-validate --external:react-devtools-core --external:fs --external:path --external:events --external:crypto --external:os --external:stream --external:net --external:tls --external:child_process --external:url --external:util --external:buffer --external:zlib --external:http --external:https --external:dns --external:readline --external:querystring --external:string_decoder --external:tty --external:assert --external:module

      - name: Hardcode version
        working-directory: torlink
        shell: pwsh
        run: |
          node -e "const fs=require('fs');let s=fs.readFileSync('dist/torlink.mjs','utf8');const p=JSON.parse(fs.readFileSync('package.json','utf8'));s=s.replace(/readFileSync[2]?\(new URL\([^)]+package\.json[^)]+\)/g,'JSON.parse(JSON.stringify({version:\"'+p.version+'\"}))');s=s.replace(/fs\d+\.readFileSync\(new URL\([^)]+package\.json[^)]+\)/g,'JSON.parse(JSON.stringify({version:\"'+p.version+'\"}))');fs.writeFileSync('dist/torlink.mjs',s);console.log('Version hardcoded to '+p.version)"

      - name: "Pass 2: Convert ESM to CJS"
        working-directory: torlink
        run: node ../scripts/esm-to-cjs.mjs dist/torlink.mjs dist/torlink.cjs

      - name: Create webrtc-stub
        working-directory: torlink
        shell: pwsh
        run: |
          @"
          export const RTCPeerConnection = undefined;
          export const RTCSessionDescription = undefined;
          export const RTCIceCandidate = undefined;
          export default undefined;
          "@ | Out-File -Encoding utf8 dist/webrtc-stub.mjs

      - name: "Pass 3: Package with @yao-pkg/pkg"
        working-directory: torlink
        run: pkg -t node22-win-x64 dist/torlink.cjs -o torlink.exe --fallback-to-source

      - name: Verify exe
        working-directory: torlink
        shell: pwsh
        run: |
          $size = (Get-Item torlink.exe).Length
          $sizeMB = [math]::Round($size / 1MB, 1)
          Write-Host "torlink.exe: $sizeMB MB"
          if ($size -lt 1MB) { throw "exe too small" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: torlink-windows
          path: torlink/torlink.exe

      - name: Create Release
        if: inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: torlink v1.8.0 Windows (CJS Bundle)
          body: |
            ## torlink v1.8.0 — Windows Native Build

            Built on `windows-latest` with Visual Studio 2022.

            - Single CJS bundle (no dynamic imports)
            - Native modules compiled for Windows x64
            - Just double-click `torlink.exe` to run

            ### Quick Start
            1. Download `torlink.exe`
            2. Double-click it, or run from terminal: `torlink.exe`
            3. No Node.js needed

            ### What it does
            - Search across curated sources (FitGirl, YTS, The Pirate Bay, 1337x, EZTV, Nyaa, SubsPlease)
            - Download to `Downloads\torlink\` folder
            - Seed automatically after download

            ### Keyboard shortcuts
            - Type query + Enter to search
            - ↑/↓ to navigate, d to download, ? for help

            ### Headless modes
            ```
            torlink.exe search "query" --category movies
            torlink.exe seed ./my-folder
            torlink.exe serve
            torlink.exe watch ./incoming
            ```

            ### Source
            - [baairon/torlink](https://github.com/baairon/torlink) v1.8.0
            - Node.js 22 runtime embedded via @yao-pkg/pkg
          files: torlink/torlink.exe
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
