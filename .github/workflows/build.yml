name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub release'
        type: boolean
        default: true
      tag:
        description: 'Release tag'
        required: false
        default: 'v1.8.0-windows'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout torlink-windows repo
        uses: actions/checkout@v4
        with:
          path: build-repo

      - name: Checkout torlink source
        uses: actions/checkout@v4
        with:
          repository: baairon/torlink
          ref: v1.8.0
          path: torlink

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: torlink
        run: npm install

      - name: Build the app
        working-directory: torlink
        run: npm run build

      - name: Download bundled Node.js
        shell: pwsh
        run: |
          $ver = (node --version).TrimStart('v')
          $base = $ver.Split('-')[0]
          $url = "https://nodejs.org/dist/v$base/node-v$base-win-x64.zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile node.zip
          Expand-Archive -Path node.zip -DestinationPath node-extract
          $nodeExe = Get-ChildItem node-extract -Filter node.exe -Recurse | Select-Object -First 1
          Copy-Item $nodeExe.FullName torlink\bundled-node.exe
          Write-Host "Bundled Node.js: $((Get-Item torlink\bundled-node.exe).Length / 1MB) MB"

      - name: Build portable folder
        shell: pwsh
        run: |
          if (Test-Path portable) { Remove-Item -Recurse -Force portable }
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item torlink\bundled-node.exe portable\bundled-node.exe
          Copy-Item -Recurse torlink\dist portable\dist
          Copy-Item torlink\package.json portable\package.json
          Copy-Item -Recurse torlink\node_modules portable\node_modules
          $total = (Get-ChildItem portable -Recurse -File | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host "Portable folder: $([math]::Round($total, 1)) MB"

      - name: Smoke test
        shell: pwsh
        run: |
          & portable\bundled-node.exe --version
          & portable\bundled-node.exe -e "require('node:crypto'); require('node:fs'); console.log('Core modules OK')"
          Write-Host "Smoke test passed"

      - name: Compile C# launcher
        shell: pwsh
        run: |
          $csc = Get-ChildItem "C:\Windows\Microsoft.NET\Framework64\v4.0.30319" -Filter csc.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $csc) {
            $csc = Get-ChildItem "C:\Windows\Microsoft.NET\Framework64" -Filter csc.exe -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match "v4" } | Select-Object -First 1
          }
          if (-not $csc) { throw "csc.exe not found" }
          Write-Host "Using: $($csc.FullName)"
          & $csc.FullName /nologo /out:portable\torlink.exe /target:exe /platform:x64 build-repo\scripts\launcher.cs
          if (Test-Path portable\torlink.exe) {
            Write-Host "Launcher built: $((Get-Item portable\torlink.exe).Length / 1KB) KB"
          } else {
            throw "Launcher build failed"
          }

      - name: Create self-extracting exe
        shell: pwsh
        run: |
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) { choco install 7zip -y --no-progress }
          if (-not (Test-Path $sevenZip)) { throw "7-Zip not found" }

          $sfx = "C:\Program Files\7-Zip\7zSD.sfx"
          if (-not (Test-Path $sfx)) {
            Write-Host "7zSD.sfx not found, downloading 7-Zip Extra..."
            Invoke-WebRequest -Uri "https://www.7-zip.org/a/7z2409-extra.7z" -OutFile 7z-extra.7z
            & $sevenZip x 7z-extra.7z -o7z-extra -y
            $sfx = Get-ChildItem 7z-extra -Filter "7zSD.sfx" -Recurse | Select-Object -First 1
            if (-not $sfx) { throw "7zSD.sfx not found even after download" }
            $sfx = $sfx.FullName
            Write-Host "Downloaded 7zSD.sfx: $sfx"
          }

          & $sevenZip a -t7z -mx=7 -mmt=on portable.7z portable\* -y
          Write-Host "portable.7z: $((Get-Item portable.7z).Length / 1MB) MB"

          Copy-Item build-repo\scripts\sfx.conf sfxconf.txt
          cmd /c "copy /b `"$sfx`" + sfxconf.txt + portable.7z torlink.exe"
          if (-not (Test-Path torlink.exe)) { throw "SFX creation failed" }
          Write-Host "torlink.exe: $((Get-Item torlink.exe).Length / 1MB) MB"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: torlink-windows
          path: torlink.exe

      - name: Create Release
        if: inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: torlink v1.8.0 Windows (Portable)
          body: |
            ## torlink v1.8.0 - Windows Portable

            Self-extracting executable. Double-click to run.

            - Bundles Node.js 22 + all native modules compiled for Windows
            - Extracts to a temp folder, runs torlink, cleans up on exit
            - No installation needed, no Node.js required

            **Quick Start:** Download `torlink.exe`, double-click it.

            **Source:** [baairon/torlink](https://github.com/baairon/torlink) v1.8.0
          files: torlink.exe
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
