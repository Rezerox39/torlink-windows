name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub release'
        type: boolean
        default: true
      tag:
        description: 'Release tag'
        required: false
        default: 'v1.8.0-windows'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout this repo (has build scripts)
        uses: actions/checkout@v4

      - name: Checkout torlink source
        uses: actions/checkout@v4
        with:
          repository: baairon/torlink
          ref: v1.8.0
          path: torlink

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: torlink
        run: npm install

      - name: Install build tools
        run: npm install -g esbuild @yao-pkg/pkg

      - name: "Pass 1: Bundle to ESM (native modules stubbed)"
        working-directory: torlink
        run: node ../scripts/build-esm.mjs

      - name: "Pass 2: Convert ESM to CJS"
        working-directory: torlink
        run: node ../scripts/esm-to-cjs.mjs dist/torlink.mjs dist/torlink.cjs

      - name: Create webrtc-stub.mjs
        working-directory: torlink
        shell: bash
        run: |
          cat > dist/webrtc-stub.mjs << 'STUB'
          export const RTCPeerConnection = undefined;
          export const RTCSessionDescription = undefined;
          export const RTCIceCandidate = undefined;
          export default undefined;
          STUB

      - name: Configure pkg
        working-directory: torlink
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            pkg.scripts = ['dist/torlink.cjs'];
            pkg.assets = ['dist/webrtc-stub.mjs'];
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: "Pass 3: Package with @yao-pkg/pkg"
        working-directory: torlink
        shell: bash
        run: pkg -t node22-win-x64 dist/torlink.cjs -o torlink.exe --fallback-to-source

      - name: Verify exe
        working-directory: torlink
        shell: pwsh
        run: |
          $size = (Get-Item torlink.exe).Length
          $sizeMB = [math]::Round($size / 1MB, 1)
          Write-Host "torlink.exe: $sizeMB MB"
          if ($size -lt 1MB) { throw "exe too small" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: torlink-windows
          path: torlink/torlink.exe

      - name: Create Release
        if: inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: torlink v1.8.0 Windows (CJS Bundle)
          body: |
            ## torlink v1.8.0 — Windows Native Build

            Built on `windows-latest` with Visual Studio 2022.

            - Single self-contained CJS file (no .mjs, no dynamic import)
            - Native modules stubbed (degrades to TCP-only transport)
            - Top-level await handled via void wrapper
            - No .node files in snapshot — nothing to fail at runtime

            ### Quick Start
            1. Download `torlink.exe`
            2. Double-click it, or run from terminal: `torlink.exe`
            3. No Node.js needed

            ### What it does
            - Search across curated sources (FitGirl, YTS, The Pirate Bay, 1337x, EZTV, Nyaa, SubsPlease)
            - Download to `Downloads\torlink\` folder
            - Seed automatically after download

            ### Keyboard shortcuts
            - Type query + Enter to search
            - ↑/↓ to navigate, d to download, ? for help

            ### Source
            - [baairon/torlink](https://github.com/baairon/torlink) v1.8.0
            - Node.js 22 runtime embedded via @yao-pkg/pkg
          files: torlink/torlink.exe
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
