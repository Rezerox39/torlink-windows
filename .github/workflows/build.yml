name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub release'
        type: boolean
        default: true
      tag:
        description: 'Release tag'
        required: false
        default: 'v1.8.0-windows'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout torlink-windows repo
        uses: actions/checkout@v4
        with:
          path: build-repo

      - name: Checkout torlink source
        uses: actions/checkout@v4
        with:
          repository: baairon/torlink
          ref: v1.8.0
          path: torlink

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: torlink
        run: npm install

      - name: Build the app
        working-directory: torlink
        run: npm run build

      - name: Download bundled Node.js
        shell: pwsh
        run: |
          $ver = (node --version).TrimStart('v')
          $base = $ver.Split('-')[0]
          $url = "https://nodejs.org/dist/v$base/node-v$base-win-x64.zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile node.zip
          Expand-Archive -Path node.zip -DestinationPath node-extract
          $nodeExe = Get-ChildItem node-extract -Filter node.exe -Recurse | Select-Object -First 1
          Copy-Item $nodeExe.FullName torlink\bundled-node.exe
          Write-Host "Bundled Node.js: $((Get-Item torlink\bundled-node.exe).Length / 1MB) MB"

      - name: Build portable folder
        shell: pwsh
        run: |
          if (Test-Path portable) { Remove-Item -Recurse -Force portable }
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item torlink\bundled-node.exe portable\bundled-node.exe
          Copy-Item -Recurse torlink\dist portable\dist
          Copy-Item torlink\package.json portable\package.json
          Copy-Item -Recurse torlink\node_modules portable\node_modules
          $total = (Get-ChildItem portable -Recurse -File | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host "Portable folder: $([math]::Round($total, 1)) MB"

      - name: Smoke test
        shell: pwsh
        run: |
          & portable\bundled-node.exe --version
          & portable\bundled-node.exe -e "require('node:crypto'); require('node:fs'); console.log('Core modules OK')"
          Write-Host "Smoke test passed"

      - name: Compile C# self-extracting launcher
        shell: pwsh
        run: |
          $csc = Get-ChildItem "C:\Windows\Microsoft.NET\Framework64\v4.0.30319" -Filter csc.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $csc) {
            $csc = Get-ChildItem "C:\Windows\Microsoft.NET\Framework64" -Filter csc.exe -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match "v4" } | Select-Object -First 1
          }
          if (-not $csc) { throw "csc.exe not found" }
          Write-Host "Using: $($csc.FullName)"

          & $csc.FullName /nologo /out:launcher.exe /target:exe /platform:x64 `
            /r:System.IO.Compression.dll `
            build-repo\scripts\launcher.cs

          if (Test-Path launcher.exe) {
            Write-Host "Launcher built: $((Get-Item launcher.exe).Length / 1KB) KB"
          } else {
            throw "Launcher build failed"
          }

      - name: Create self-extracting exe (append ZIP to launcher)
        shell: pwsh
        run: |
          # Compress the portable folder into a ZIP
          Compress-Archive -Path portable\* -DestinationPath payload.zip -Force
          $zipMB = (Get-Item payload.zip).Length / 1MB
          Write-Host "Payload ZIP: $([math]::Round($zipMB, 1)) MB"

          # Append the ZIP to the compiled launcher exe
          # The launcher will search for the ZIP data at the end of its own file
          $launcher = [System.IO.File]::ReadAllBytes("launcher.exe")
          $zip = [System.IO.File]::ReadAllBytes("payload.zip")

          $exe = New-Object byte[] ($launcher.Length + $zip.Length)
          [System.Buffer]::BlockCopy($launcher, 0, $exe, 0, $launcher.Length)
          [System.Buffer]::BlockCopy($zip, 0, $exe, $launcher.Length, $zip.Length)
          [System.IO.File]::WriteAllBytes("torlink.exe", $exe)

          $finalMB = (Get-Item torlink.exe).Length / 1MB
          Write-Host "torlink.exe: $([math]::Round($finalMB, 1)) MB"
          Write-Host "Launcher: $([math]::Round($launcher.Length / 1KB)) KB + Payload: $([math]::Round($zipMB, 1)) MB"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: torlink-windows
          path: torlink.exe

      - name: Create Release
        if: inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: torlink v1.8.0 Windows (Portable)
          body: |
            ## torlink v1.8.0 - Windows Portable

            Self-extracting executable. Double-click to run.

            - Bundles Node.js 22 + all native modules compiled for Windows
            - Extracts to a temp folder, runs torlink, cleans up on exit
            - No installation needed, no Node.js required

            **Quick Start:** Download `torlink.exe`, double-click it.

            **Source:** [baairon/torlink](https://github.com/baairon/torlink) v1.8.0
          files: torlink.exe
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
